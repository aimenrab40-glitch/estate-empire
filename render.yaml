# SUPER NOVA Mafia — Render Blueprint (Docker, FREE tier — no credit card)
# Render → New → Blueprint → point at this repo.
# Secrets are set manually in the dashboard (sync: false) — never stored here.
services:
  - type: web
    name: super-nova-mafia
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    # Docker build (Dockerfile at repo root). Render sets PORT (default 10000);
    # the server reads process.env.PORT and listens on 0.0.0.0.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: REQUIRE_DB
        value: "1"
      - key: EMBEDDED_PG
        value: "0"
      # Neon pooled connection string, e.g.
      # postgresql://USER:PASSWORD@ep-xxxx-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false # set manually in the dashboard (secret)
      # Public URL of this service, e.g. https://super-nova-mafia.onrender.com
      # Used for OAuth redirect URIs when the Host header differs.
      - key: PUBLIC_ORIGIN
        sync: false
      # Google OAuth (optional — guests play without it). Set after creating
      # credentials at console.cloud.google.com; the redirect URI to register
      # is  https://<your-service>.onrender.com/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Discord OAuth (optional)
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
